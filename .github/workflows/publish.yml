name: publish

# Publishes @opentrace/cli to npm when a v* tag is pushed, using npm Trusted
# Publishing (OIDC) — no npm token. GitHub Actions mints a short-lived OIDC
# identity that npm verifies against the package's configured trusted publisher,
# and provenance is generated automatically.
#
# One-time prerequisites:
#   1. The package must already exist on npm (trusted publishing can't do the
#      very first publish). Bootstrap once locally: `npm publish --no-provenance`.
#   2. On npmjs.com → @opentrace/cli → Settings → Trusted Publisher → GitHub
#      Actions: repo opentrace/opentrace-cli, workflow "publish.yml", action npm publish.
#
# Release flow: `npm version <patch|minor|major>` then `git push --follow-tags`.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # trusted publishing needs Node >= 22.14.0
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npm run build
      - run: npm publish # tokenless — authenticated via the OIDC trusted publisher
